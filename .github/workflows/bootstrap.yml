name: Core and bootstrap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-bootstrap:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit public source and documentation
        shell: powershell
        run: .\scripts\Test-Repository.ps1
      - name: Verify screenshot evidence admission
        shell: powershell
        run: |
          python -B tests/screenshot-evidence.py
          if ($LASTEXITCODE -ne 0) { throw 'Screenshot evidence admission tests failed.' }
      - name: Verify original mouse replay data controls
        shell: powershell
        run: |
          python -B scripts/Test-SnowMouseReplay.py --output "$env:RUNNER_TEMP\classick-snow-replay"
          if ($LASTEXITCODE -ne 0) { throw 'Mouse replay data controls failed.' }
      - name: Verify scene import contract consistency
        shell: powershell
        run: |
          python -B scripts/Verify-SceneImportContracts.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'Scene import contract consistency failed.' }
          python -B tests/scene-import-contracts.py
          if ($LASTEXITCODE -ne 0) { throw 'Scene import contract mutation tests failed.' }
      - name: Prepare pinned portable tools
        shell: powershell
        run: .\scripts\Setup-Windows.ps1
      - name: Prepare pinned second compiler
        shell: powershell
        run: .\scripts\Setup-SecondCompiler.ps1
      - name: Verify two fresh hosted builds
        shell: powershell
        run: .\scripts\Verify-Bootstrap.ps1
      - name: PC window report width and endian objects
        shell: pwsh
        run: .\scripts\Verify-PCWindowObjects.ps1 -BuildRoot build\pc-window-objects

      - name: Audit isolated monochrome presentation objects
        run: .\scripts\Verify-MonoPresentObjects.ps1 -BuildRoot build\mono-present-objects
      - name: Audit firmware-neutral window session objects
        run: .\scripts\Verify-WindowSessionObjects.ps1 -BuildRoot build\window-session-objects
      - name: Native outline width, endian and EFI-ABI object twins
        shell: pwsh
        run: .\scripts\Verify-OutlineObjects.ps1 -BuildRoot build\outline-verification
      - name: Pointer and cursor width/endian/EFI-ABI objects
        shell: pwsh
        run: .\scripts\Verify-PointerCursorObjects.ps1 -BuildRoot build\pointer-cursor-objects
      - name: Audit original window native objects (no target run)
        shell: pwsh
        run: .\scripts\Verify-WindowObjects.ps1 -BuildRoot build\window-objects
      - name: Verify native input owner objects
        shell: pwsh
        run: .\scripts\Verify-WindowInputObjects.ps1 -BuildRoot build\window-input-objects
      - name: Verify ordered native capture objects
        shell: pwsh
        run: .\scripts\Verify-CaptureObjects.ps1 -BuildRoot build\capture-objects
      - name: Verify pure native inbox objects
        shell: pwsh
        run: .\scripts\Verify-InboxObjects.ps1 -BuildRoot build\inbox-objects
      - name: Verify foreground coordinator native objects
        shell: pwsh
        run: .\scripts\Verify-ForegroundObjects.ps1 -BuildRoot build\foreground-objects
      - name: Audit original window composition objects (no target run)
        shell: pwsh
        run: .\scripts\Verify-WindowSceneObjects.ps1 -BuildRoot build\window-scene-objects
      - name: Verify hosted core, loader, exceptions, devices, boot media and unloaded fault fixtures
        shell: powershell
        run: .\scripts\Verify-LoadedApp.ps1 -BuildRoot build\media-verification -Sanitizers
      - name: Build paired selected-port native PC candidate (unloaded)
        shell: pwsh
        run: |
          .\scripts\Verify-UEFIImage.ps1 -BuildRoot build\selected-drawing-efi -SelectedDrawing
          .\scripts\Package-SelectedDrawingPC.ps1 -BuildRoot build\selected-drawing-efi -MediaWriter build\media-verification\clang-hosted\debug-a\classick_boot_media.exe -TwinWriter build\media-verification\gcc-i686\classick_boot_media.exe
          .\scripts\Verify-SelectedDrawingObjects.ps1 -BuildRoot build\selected-drawing-objects
      - name: Build paired native outline PC preview candidate (unbooted)
        shell: pwsh
        run: |
          .\scripts\Verify-UEFIImage.ps1 -BuildRoot build\outline-drawing-efi -OutlineDrawing
          .\scripts\Package-OutlineDrawingPC.ps1 -BuildRoot build\outline-drawing-efi -MediaWriter build\media-verification\clang-hosted\debug-a\classick_boot_media.exe -TwinWriter build\media-verification\gcc-i686\classick_boot_media.exe
          .\scripts\Verify-OutlineDrawingObjects.ps1 -BuildRoot build\outline-drawing-objects
      - name: Build opt-in native window PC candidate (unbooted)
        shell: pwsh
        run: |
          .\scripts\Verify-UEFIImage.ps1 -BuildRoot build\window-drawing-efi -WindowDrawing
          .\scripts\Package-WindowPC.ps1 -BuildRoot build\window-drawing-efi -MediaWriter build\media-verification\clang-hosted\debug-a\classick_boot_media.exe -TwinWriter build\media-verification\gcc-i686\classick_boot_media.exe
          .\scripts\Verify-WindowBootObjects.ps1 -BuildRoot build\window-boot-objects
      - name: Retain native window PC candidate and diagnostics (unbooted)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-window-preview-pc-unbooted
          path: |
            build/window-drawing-efi/efi-results.json
            build/window-drawing-efi/window-media.json
            build/window-drawing-efi/window-drawing.img
            build/window-drawing-efi/payload/EFI/BOOT/BOOTX64.EFI
            build/window-boot-objects/window-objects.json
          if-no-files-found: error
      - name: Retain paired native outline PC preview candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-outline-preview-pc
          path: |
            build/outline-drawing-efi/efi-results.json
            build/outline-drawing-efi/outline-media.json
            build/outline-drawing-efi/outline-drawing.img
            build/outline-drawing-efi/payload/EFI/BOOT/BOOTX64.EFI
            build/outline-drawing-objects/manifest.json
          if-no-files-found: error
      - name: Retain paired selected-port PC candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-selected-drawing-efi
          path: |
            build/selected-drawing-efi/efi-results.json
            build/selected-drawing-efi/selected-media.json
            build/selected-drawing-efi/selected-drawing.img
            build/selected-drawing-objects/manifest.json
            build/selected-drawing-efi/payload/EFI/BOOT/BOOTX64.EFI
          if-no-files-found: error
      - name: Audit shared product scene and drawing objects
        shell: powershell
        run: .\scripts\Verify-DrawingAppObjects.ps1 -BuildRoot build\drawing-verification
      - name: Mouse foundation width and endian object checks
        shell: pwsh
        run: .\scripts\Verify-MouseObjects.ps1 -BuildRoot build\mouse-verification

      - name: Pure native selection width and endian objects
        shell: pwsh
        run: .\scripts\Verify-SelectionObjects.ps1 -BuildRoot build\selection-verification
      - name: Integrated port owner width and endian objects
        shell: pwsh
        run: .\scripts\Verify-PortOwnerObjects.ps1 -BuildRoot build\port-owner-verification



  m68k-rom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify original mouse replay data controls
        run: python3 -B scripts/Test-SnowMouseReplay.py --output "$RUNNER_TEMP/classick-snow-replay"
      - name: Prepare hash-pinned workspace 68000 tools
        run: python3 scripts/Setup-M68k.py --output "$RUNNER_TEMP/classick-m68k"
      - name: Verify isolated native input owner closure
        run: python3 scripts/Verify-WindowInputM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-window-input"
      - name: Verify isolated capture helper closure for68000
        run: python3 scripts/Verify-CaptureM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-capture"
      - name: Verify isolated inbox closure for68000
        run: python3 scripts/Verify-InboxM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-inbox"
      - name: Verify foreground coordinator closure for68000
        run: python3 scripts/Verify-ForegroundM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-foreground"
      - name: Retain foreground compiler manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-foreground-build
          path: ${{ runner.temp }}/classick-foreground/manifest.json
      - name: Verify Mac RAM window bootstrap68000
        run: python3 scripts/Verify-MacWindowRAMM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-mac-ram"
      - name: Retain Mac RAM bootstrap manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-mac-ram
          path: ${{ runner.temp }}/classick-mac-ram/manifest.json
          if-no-files-found: error
      - name: Build native Mac window candidate twins (unbooted)
        run: python3 scripts/Build-LoadedAppROM.py --window-drawing --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-window-preview"
      - name: Retain native Mac window candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-window-preview-mac
          path: |
            ${{ runner.temp }}/classick-window-preview/manifest.json
            ${{ runner.temp }}/classick-window-preview/Os-a/classick-loaded-app.rom
            ${{ runner.temp }}/classick-window-preview/Os-a/classick-loaded-app.map
            ${{ runner.temp }}/classick-window-preview/Os-a/native-window-disassembly.txt
          if-no-files-found: error
      - name: Build opt-in finite pending-edge experiment twins (unbooted)
        run: python3 scripts/Build-LoadedAppROM.py --window-drawing --window-pending-defer-probe --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-window-defer"
      - name: Verify finite-defer experiment and unchanged normal ROM
        run: python3 scripts/Verify-MacIdleProbe.py --pending-defer --normal "$RUNNER_TEMP/classick-window-preview" --probe "$RUNNER_TEMP/classick-window-defer" --output "$RUNNER_TEMP/classick-defer-verification.json"
      - name: Retain finite-defer experiment (unbooted)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-window-defer-mac
          path: |
            ${{ runner.temp }}/classick-window-defer/manifest.json
            ${{ runner.temp }}/classick-window-defer/Os-a/classick-loaded-app.rom
            ${{ runner.temp }}/classick-window-defer/Os-a/classick-loaded-app.map
            ${{ runner.temp }}/classick-window-defer/Os-a/native-window-disassembly.txt
            ${{ runner.temp }}/classick-defer-verification.json
          if-no-files-found: error
      - name: Build automatic idle diagnostic twins (unbooted)
        run: python3 scripts/Build-LoadedAppROM.py --window-drawing --window-idle-probe --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-window-idle"
      - name: Verify idle diagnostic and unchanged normal ROM
        run: python3 scripts/Verify-MacIdleProbe.py --normal "$RUNNER_TEMP/classick-window-preview" --probe "$RUNNER_TEMP/classick-window-idle" --output "$RUNNER_TEMP/classick-idle-verification.json"
      - name: Retain automatic idle diagnostic
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-window-idle-mac
          path: |
            ${{ runner.temp }}/classick-window-idle/manifest.json
            ${{ runner.temp }}/classick-window-idle/Os-a/classick-loaded-app.rom
            ${{ runner.temp }}/classick-window-idle/Os-a/classick-loaded-app.map
            ${{ runner.temp }}/classick-window-idle/Os-a/native-window-disassembly.txt
            ${{ runner.temp }}/classick-idle-verification.json
          if-no-files-found: error
      - name: Build declared alternate DCD-sense Mac candidate (unbooted)
        run: python3 scripts/Build-LoadedAppROM.py --window-drawing --dcd-invert 3 --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-window-inverted"
      - name: Retain alternate DCD-sense Mac candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-window-inverted-mac
          path: |
            ${{ runner.temp }}/classick-window-inverted/manifest.json
            ${{ runner.temp }}/classick-window-inverted/Os-a/classick-loaded-app.rom
            ${{ runner.temp }}/classick-window-inverted/Os-a/classick-loaded-app.map
            ${{ runner.temp }}/classick-window-inverted/Os-a/native-window-disassembly.txt
          if-no-files-found: error
      - name: Audit isolated MC68000 short-exclusion callbacks (unbound)
        run: python3 scripts/Verify-M68kExclusion.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-m68k-exclusion"
      - name: Retain MC68000 exclusion compiler manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-m68k-exclusion
          path: ${{ runner.temp }}/classick-m68k-exclusion/manifest.json
          if-no-files-found: error
      - name: Retain inbox compiler manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-inbox-build
          path: ${{ runner.temp }}/classick-inbox/manifest.json
          if-no-files-found: error
      - name: Retain capture helper compiler manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-capture-build
          path: ${{ runner.temp }}/classick-capture/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-window-input-build
          path: ${{ runner.temp }}/classick-window-input/manifest.json
          if-no-files-found: error
      - name: Compile original window composition for68000 (no target run)
        run: python3 scripts/Verify-WindowSceneM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-window-scene"
      - name: Retain native window composition compiler manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-window-scene-build
          path: ${{ runner.temp }}/classick-window-scene/manifest.json
          if-no-files-found: error
      - name: Compile original native window for68000 (no target run)
        run: python3 scripts/Verify-WindowM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-window"
      - name: Retain native window compiler manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-window-build
          path: ${{ runner.temp }}/classick-window/manifest.json
          if-no-files-found: error
      - name: Compile shared native pointer/cursor helpers for68000 (no target run)
        run: python3 scripts/Verify-PointerCursorM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-pointer-cursor"
      - name: Retain native pointer/cursor compiler manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-pointer-cursor-build
          path: ${{ runner.temp }}/classick-pointer-cursor/manifest.json
          if-no-files-found: error
      - name: Compile separate native outline for68000 (no target run)
        run: python3 scripts/Verify-OutlineM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-outline"
      - name: Retain native outline compiler manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-native-outline
          path: ${{ runner.temp }}/classick-outline/manifest.json
          if-no-files-found: error
      - name: Compile pure native port selection for68000 (no target run)
        run: python3 scripts/Verify-SelectionM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-selection"
      - name: Audit integrated prepared-port native68000 closure and storage
        run: python3 scripts/Verify-PortOwnerM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-port-owner"
      - name: Retain prepared-port closure manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-port-owner-build
          path: ${{ runner.temp }}/classick-port-owner/manifest.json
          if-no-files-found: error
      - name: Retain native selection object manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-native-selection
          path: ${{ runner.temp }}/classick-selection/manifest.json
          if-no-files-found: error
      - name: Build and audit original ROM twins
        run: python3 scripts/Build-MacROM.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-rom"
      - name: Audit original checked memory 68000 objects and program encoding
        run: python3 scripts/Verify-GuestM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-guest-memory"
      - name: Retain checked memory build manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-guest-memory-build
          path: ${{ runner.temp }}/classick-guest-memory/manifest.json
          if-no-files-found: error
      - name: Audit original Memory Manager 68000 objects and storage budget
        run: python3 scripts/Verify-MMM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-mm"
      - name: Retain Memory Manager build manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-memory-manager-build
          path: ${{ runner.temp }}/classick-mm/manifest.json
          if-no-files-found: error
      - name: Audit original guest memory trap objects and program encoding
        run: python3 scripts/Verify-MemoryTrapsM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-memory-traps"
      - name: Retain guest memory trap build manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-guest-memory-traps-build
          path: ${{ runner.temp }}/classick-memory-traps/manifest.json
          if-no-files-found: error
      - name: Audit bounded returning guest calls and original encoding
        run: python3 scripts/Verify-GuestCallsM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-guest-calls"
      - name: Retain bounded guest-call build manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-guest-calls-build
          path: ${{ runner.temp }}/classick-guest-calls/manifest.json
          if-no-files-found: error
      - name: Audit typed bounded register patch closure and original encoding
        run: python3 scripts/Verify-GuestPatchesM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-guest-patches"
      - name: Retain typed guest-patch build manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-guest-patches-build
          path: ${{ runner.temp }}/classick-guest-patches/manifest.json
          if-no-files-found: error
      - name: Audit original bounded resource reader closure and storage
        run: python3 scripts/Verify-ResourceM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-resource-reader"
      - name: Retain resource-reader build manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-resource-reader-build
          path: ${{ runner.temp }}/classick-resource-reader/manifest.json
          if-no-files-found: error
      - name: Audit original bounded session closure and encoding
        run: python3 scripts/Verify-GuestSessionsM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-guest-sessions"
      - name: Retain bounded session build manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-guest-sessions-build
          path: ${{ runner.temp }}/classick-guest-sessions/manifest.json
          if-no-files-found: error
      - name: Audit original typed Toolbox closure and encoding
        run: python3 scripts/Verify-ToolboxM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-toolbox"
      - name: Retain typed Toolbox build manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-toolbox-build
          path: ${{ runner.temp }}/classick-toolbox/manifest.json
          if-no-files-found: error
      - name: Audit original hosted heap lifecycle closure and storage
        run: python3 scripts/Verify-HeapLifecycleM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-heap-lifecycle"
      - name: Retain hosted heap lifecycle build manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-heap-lifecycle-build
          path: ${{ runner.temp }}/classick-heap-lifecycle/manifest.json
          if-no-files-found: error
      - name: Audit original hosted resource residency closure and storage
        run: python3 scripts/Verify-ResidencyM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-resource-residency"
      - name: Retain hosted resource residency build manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-resource-residency-build
          path: ${{ runner.temp }}/classick-resource-residency/manifest.json
          if-no-files-found: error
      - name: Audit original data-only CODE preflight closure and storage
        run: python3 scripts/Verify-CodePreflightM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-code-preflight"
      - name: Retain CODE preflight build manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-code-preflight-build
          path: ${{ runner.temp }}/classick-code-preflight/manifest.json
          if-no-files-found: error
      - name: Audit original data-only eager CODE image closure and storage
        run: python3 scripts/Verify-CodeImageM68k.py --tool-root "$RUNNER_TEMP/classick-m68k/root" --output "$RUNNER_TEMP/classick-code-image"
      - name: Retain CODE image build manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: classick-code-image-build
          path: ${{ runner.temp }}/classick-code-image/manifest.json
